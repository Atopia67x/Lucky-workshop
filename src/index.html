<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>120-cell 微型引擎 (261001)</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <div id="canvas-wrap"></div>

  <div id="topnav">
    <button id="btn-mode-c">120cell-C</button>
    <button id="btn-mode-f">120cell-F</button>
    <button id="btn-mode-v">120cell-V</button>
  </div>

  <div id="sliderC">
    <span>显示个数</span>
    <button id="btn-c-dec">-</button>
    <input id="range-c" type="range" min="0" max="45" step="1" value="45">
    <button id="btn-c-inc">+</button>
    <span class="val" id="range-c-val">45</span>
  </div>

  <div id="ui">
  <button id="btn-start">开始录制</button>
  <button id="btn-stop">停止并下载</button>
  </div>

  <div id="hint">
    推荐使用 Chrome 浏览器 · <b>左键拖</b> 旋转 ·
    <b>滚轮</b> 缩放 ·
    <b>右键拖</b> 平移 ·
    <b>中键单击</b> 移至中心
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
